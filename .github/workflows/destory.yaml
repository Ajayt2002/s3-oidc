name: Terraform Destroy

# Manual-only. Destroy is deliberately never triggered by push or pull_request.
on:
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.8.0
  AWS_REGION: eu-west-1

jobs:

  terraform-destroy-plan:
    name: Terraform Destroy Plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_terraform-plan-reusable.yml
    with:
      destroy: true
      tf_version: 1.8.0
      aws_region: eu-west-1
      artifact_name: terraform-destroy-plan
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  terraform-destroy-apply:
    name: Terraform Destroy Apply
    runs-on: ubuntu-latest

    needs: terraform-destroy-plan

    # This environment has the required reviewer
    environment:
      name: terraform-destroy

    permissions:
      id-token: write
      contents: read

    # Only main can be destroyed, and only when the destroy plan found resources to remove
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.terraform-destroy-plan.outputs.plan_exitcode == '2'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # IMPORTANT:
      # Approval happens BEFORE this job starts.
      # Therefore AWS credentials are only requested after approval.

      - name: Download Terraform Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve tfplan