name: Terraform Destroy

# Manual-only. Destroy is deliberately never triggered by push or pull_request.
on:
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.8.0
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:

  terraform-destroy-plan:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Runs before AWS creds are requested, so a formatting failure fails fast.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan > tfplan.txt 2>&1

          exitcode=$?

          cat tfplan.txt

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Terraform Destroy Plan Exit Code: $exitcode"
          echo "======================================"

          if [ "$exitcode" -eq 1 ]; then
            echo "Terraform destroy plan failed."
            exit 1
          fi

          if [ "$exitcode" -eq 2 ]; then
            echo "Resources will be destroyed."
          else
            echo "No resources to destroy."
          fi

      # Writes a clean, readable destroy plan to the run's Summary page
      # (visible to the approver before they click Approve — no digging through raw logs).
      - name: Publish Plan to Job Summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          {
            echo "## Terraform Destroy Plan"
            echo ""
            echo "\`\`\`hcl"
            terraform show -no-color tfplan
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload whenever the plan was successful:
      # 0 = nothing to destroy
      # 2 = resources will be destroyed
      - name: Upload Terraform Destroy Plan
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: |
            tfplan
            tfplan.txt
          retention-days: 7


  terraform-destroy-apply:
    name: Terraform Destroy Apply
    runs-on: ubuntu-latest

    needs: terraform-destroy-plan

    # This environment has the required reviewer
    environment:
      name: terraform-destroy

    permissions:
      id-token: write
      contents: read

    # Only main can be destroyed, and only when the destroy plan found resources to remove
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.terraform-destroy-plan.outputs.plan_exitcode == '2'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # IMPORTANT:
      # Approval happens BEFORE this job starts.
      # Therefore AWS credentials are only requested after approval.

      - name: Download Terraform Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve tfplan