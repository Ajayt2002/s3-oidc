name: Terraform Plan and Apply

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -no-color \
            -detailed-exitcode \
            -out=tfplan 2>&1 | tee tfplan.txt

          exitcode=${PIPESTATUS[0]}

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

          echo "Terraform plan exit code: $exitcode"

          # 0 = No changes
          # 1 = Error
          # 2 = Changes detected

          if [ "$exitcode" -eq 1 ]; then
            exit 1
          fi

      - name: Upload Terraform Plan
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.txt
          retention-days: 7

      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const plan = fs.readFileSync('tfplan.txt', 'utf8');

            const match = plan.match(
              /Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/
            );

            let summary;

            if (match) {
              summary = `
            ## Terraform Plan Summary

            | Action | Count |
            |--------|------:|
            | Create | ${match[1]} |
            | Update | ${match[2]} |
            | Delete | ${match[3]} |
            `;
            } else {
              summary = `
            ## Terraform Plan Summary

            No infrastructure changes.
            `;
            }

            const body = `${summary}

            <details>
            <summary>Show Terraform Plan</summary>

            \`\`\`
            ${plan.slice(0, 60000)}
            \`\`\`

            </details>
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # THIS ENVIRONMENT REQUIRES APPROVAL
    environment:
      name: terraform-apply

    permissions:
      id-token: write
      contents: read

    # IMPORTANT:
    # Direct push to main ALSO reaches this job.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan