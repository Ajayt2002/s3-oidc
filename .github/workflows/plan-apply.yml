name: Terraform Plan and Apply

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.8.0
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Skip for PRs from forks: they can't assume the AWS role via OIDC
    # (secrets/OIDC tokens aren't exposed to fork-triggered pull_request runs).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Runs before AWS creds are requested, so a formatting failure fails fast.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -out=tfplan 2>&1 | tee tfplan.txt

          exitcode=${PIPESTATUS[0]}

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Terraform Plan Exit Code: $exitcode"
          echo "======================================"

          if [ "$exitcode" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi

          if [ "$exitcode" -eq 2 ]; then
            echo "Terraform changes detected."
          else
            echo "No Terraform changes detected."
          fi

      # Upload whenever the plan was successful:
      # 0 = no changes
      # 2 = changes
      - name: Upload Terraform Plan
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.txt
          retention-days: 7


  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # This environment has the required reviewer
    environment:
      name: terraform-apply

    permissions:
      id-token: write
      contents: read

    # Only main can apply, and only when the plan detected changes
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.plan_exitcode == '2'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # IMPORTANT:
      # Approval happens BEFORE this job starts.
      # Therefore AWS credentials are only requested after approval.

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        