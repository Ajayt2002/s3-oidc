name: Terraform Plan and Apply

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.8.0
  AWS_REGION: eu-west-1

jobs:

  security-scan:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false

  terraform-plan:
    name: Terraform Plan
    needs: security-scan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_terraform-plan-reusable.yml
    with:
      destroy: false
      tf_version: 1.8.0
      aws_region: eu-west-1
      artifact_name: terraform-plan
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  pr-comment:
    name: Comment Plan on PR
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'pull_request' && needs.terraform-plan.outputs.plan_exitcode == '2'

    permissions:
      pull-requests: write

    steps:
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('tfplan.txt', 'utf8');
            const maxLen = 60000;
            if (plan.length > maxLen) {
              plan = plan.substring(0, maxLen) + "\n\n... (truncated, see workflow run for full output)";
            }
            const body = `### Terraform Plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  cost-estimate:
    name: Cost Estimate (Infracost)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'pull_request' && needs.terraform-plan.outputs.plan_exitcode == '2'

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Cost Diff
        run: infracost breakdown --path tfplan.json --format json --out-file infracost.json

      - name: Post Cost Comment
        uses: infracost/actions/comment@v3
        with:
          path: infracost.json
          behavior: update
          github-token: ${{ secrets.GITHUB_TOKEN }}

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # This environment has the required reviewer
    environment:
      name: terraform-apply

    permissions:
      id-token: write
      contents: read

    # Only main can apply, and only when the plan detected changes
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.plan_exitcode == '2'

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # IMPORTANT:
      # Approval happens BEFORE this job starts.
      # Therefore AWS credentials are only requested after approval.

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan