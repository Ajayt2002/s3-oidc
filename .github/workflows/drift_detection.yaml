name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC — adjust to your preferred time
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.workflow }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.8.0
  AWS_REGION: eu-west-1

jobs:

  drift-check:
    name: Terraform Drift Check
    uses: ./.github/workflows/_terraform-plan-reusable.yml
    with:
      destroy: false
      tf_version: 1.8.0
      aws_region: eu-west-1
      artifact_name: terraform-drift-plan
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  notify-drift:
    name: Notify on Drift
    runs-on: ubuntu-latest
    needs: drift-check
    if: needs.drift-check.outputs.plan_exitcode == '2'  # Only run if drift was detected    

    permissions:
      issues: write

    steps:
      - name: Download Drift Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-drift-plan
          path: .

      # Opens a new issue on first detection, or comments on the existing
      # open drift issue on subsequent runs, so drift doesn't spam new issues.
      - name: Open or Update Drift Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('tfplan.txt', 'utf8');
            const maxLen = 60000;
            if (plan.length > maxLen) {
              plan = plan.substring(0, maxLen) + "\n\n... (truncated, see workflow run for full output)";
            }
            const title = "Terraform drift detected";
            const body = `Scheduled drift check found differences between the deployed infrastructure and the Terraform configuration on \`main\`.\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'terraform-drift',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['terraform-drift'],
              });
            }